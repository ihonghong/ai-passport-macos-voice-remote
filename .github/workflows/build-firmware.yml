name: Build firmware

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact_name.outputs.name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Restore ccache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ccache
          key: ccache-${{ github.ref_type }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref_type }}-${{ github.ref_name }}-
            ccache-

      - name: Build firmware (ESP-IDF 5.5.3 / esp32c3)
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        env:
          AI_PASSPORT_PET_PLUGIN: none
          AI_PASSPORT_PROVIDER_PROFILE: generic
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          extra_docker_args: >-
            -e CCACHE_DIR=/app/${{ github.repository }}/.ccache
            -e IDF_CCACHE_ENABLE=1
          command: ./tools/validate.sh --firmware

      - name: Set artifact name
        id: artifact_name
        run: echo "name=passport-${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: build/FoloToy-AI-Passport-full.bin
          if-no-files-found: error

  build_macos:
    runs-on: macos-latest
    env:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    outputs:
      artifact_name: ${{ steps.artifact_name.outputs.name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Require signing and notarization for tags
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          for name in \
            MACOS_CERTIFICATE_BASE64 MACOS_CERTIFICATE_PASSWORD \
            MACOS_SIGNING_IDENTITY APPLE_API_KEY_P8 APPLE_API_KEY_ID \
            APPLE_API_ISSUER_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required release secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        if: env.MACOS_CERTIFICATE_BASE64 != ''
        shell: bash
        run: |
          keychain_path="$RUNNER_TEMP/ai-passport-signing.keychain-db"
          keychain_password="$(uuidgen)"
          certificate_path="$RUNNER_TEMP/ai-passport-signing.p12"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | /usr/bin/base64 -D \
            > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          echo "AI_PASSPORT_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

      - name: Build universal native macOS app
        shell: bash
        run: |
          app_version=0.1.0
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            app_version="${GITHUB_REF_NAME#v}"
          fi
          signing_identity="-"
          if [[ -n "$MACOS_SIGNING_IDENTITY" ]]; then
            signing_identity="$MACOS_SIGNING_IDENTITY"
          fi
          AI_PASSPORT_VERSION="$app_version" \
          AI_PASSPORT_BUILD_NUMBER="$GITHUB_RUN_NUMBER" \
          AI_PASSPORT_CODESIGN_IDENTITY="$signing_identity" \
            ./host/macos/build-app.sh

      - name: Notarize and staple macOS app
        if: env.APPLE_API_KEY_P8 != ''
        shell: bash
        run: |
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$api_key_path"
          xcrun notarytool submit dist/AI-Passport-macOS.zip \
            --key "$api_key_path" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "dist/AI Passport.app"
          xcrun stapler validate "dist/AI Passport.app"
          rm -f dist/AI-Passport-macOS.zip
          ditto -c -k --keepParent --norsrc --noextattr --noacl \
            "dist/AI Passport.app" dist/AI-Passport-macOS.zip

      - name: Verify tagged macOS release
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          codesign --verify --deep --strict --verbose=2 "dist/AI Passport.app"
          xcrun stapler validate "dist/AI Passport.app"
          spctl --assess --type execute --verbose=2 "dist/AI Passport.app"

      - name: Set artifact name
        id: artifact_name
        run: echo "name=passport-macos-${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: dist/AI-Passport-macOS.zip
          if-no-files-found: error

      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/ai-passport-signing.p12"
          if [[ -n "${APPLE_API_KEY_ID:-}" ]]; then
            rm -f "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          fi
          if [[ -n "${AI_PASSPORT_KEYCHAIN_PATH:-}" && \
                -f "$AI_PASSPORT_KEYCHAIN_PATH" ]]; then
            security delete-keychain "$AI_PASSPORT_KEYCHAIN_PATH"
          fi

  release:
    if: github.ref_type == 'tag'
    needs: [build, build_macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download firmware artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release

      - name: Download macOS app artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.build_macos.outputs.artifact_name }}
          path: release

      - name: Prepare checksums and release notes
        shell: bash
        run: |
          notes_en="docs/releases/${GITHUB_REF_NAME}.md"
          notes_zh="docs/releases/${GITHUB_REF_NAME}.zh_CN.md"
          [[ -f "$notes_en" ]] || { echo "Missing $notes_en" >&2; exit 1; }
          [[ -f "$notes_zh" ]] || { echo "Missing $notes_zh" >&2; exit 1; }
          (
            cd release
            sha256sum FoloToy-AI-Passport-full.bin AI-Passport-macOS.zip \
              > SHA256SUMS.txt
          )
          {
            echo "## English"
            awk 'started { print } /^# / { started = 1 }' "$notes_en"
            echo
            echo "---"
            echo
            echo "## 简体中文"
            awk 'started { print } /^# / { started = 1 }' "$notes_zh"
          } > release/RELEASE_NOTES.md

      - name: Create release (tag push)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: "${{ github.ref_name }} — AI Passport Mac Voice Remote"
          body_path: release/RELEASE_NOTES.md
          files: |
            release/FoloToy-AI-Passport-full.bin
            release/AI-Passport-macOS.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
